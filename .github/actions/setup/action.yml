name: Setup
description: Install pnpm, Node 22, and the project's dependencies from the lockfile.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v5
      with:
        # Blume requires Node 22.12 or newer.
        node-version: 22
        cache: pnpm

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
