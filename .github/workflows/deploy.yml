# Production deploy to Cloudflare Workers (alzheimers.dev) on every push to
# main, gated by the same content and build checks ci.yml applies to pull
# requests. PR preview versions (no production traffic) are uploaded from
# ci.yml, so this workflow has exactly one job: ship production.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   API token with Workers Scripts:Edit, Workers Routes:Edit,
#                          and DNS:Edit on the alzheimers.dev zone (custom_domain
#                          attachment creates the DNS record on first deploy).
#   CLOUDFLARE_ACCOUNT_ID  The account that owns the alzheimers.dev zone.
#   AI_GATEWAY_API_KEY     Optional — Vercel AI Gateway key for Ask AI; synced to
#                          the Worker on every production deploy. Absent, Ask AI
#                          stays disabled and everything else works.
#   WEB_BOT_AUTH_PUBLIC_JWK  Optional — public JWK published at
#                          /.well-known/http-message-signatures-directory.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Production deploys run one at a time and are never cancelled mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://alzheimers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Config and content checks
        # Same gate ci.yml applies to PRs: blume doctor + the repo's
        # internal-link checker.
        run: pnpm check

      - name: Build
        # Produces dist/client (static assets, llms.txt, the agent manifests,
        # the published skills) and dist/server (the Worker plus the
        # wrangler.json the deploy is pointed at).
        run: pnpm build
        env:
          WEB_BOT_AUTH_PUBLIC_JWK: ${{ secrets.WEB_BOT_AUTH_PUBLIC_JWK }}

      - name: Validate links in the built site
        run: pnpm validate:links

      - name: Audit SEO and agent readability
        run: pnpm audit:agents --fail-on error

      - name: Sync Ask AI gateway key
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        # Runtime secret, read by `POST /api/ask` through `process.env`. Piped
        # on stdin so the value never lands in a command line or a log, and
        # idempotent: re-setting the same value is a no-op deploy to deploy.
        run: |
          if [ -n "$AI_GATEWAY_API_KEY" ]; then
            printf '%s' "$AI_GATEWAY_API_KEY" | ./scripts/cf secret put AI_GATEWAY_API_KEY --config dist/server/wrangler.json
          else
            echo "AI_GATEWAY_API_KEY secret not set — skipping (Ask AI disabled)"
          fi

      - name: Deploy to production
        # `dist/server/wrangler.json` is generated by the build: the adapter
        # merges the repo's wrangler.jsonc into it, and Blume patches in the
        # Markdown-negotiation Worker and its run_worker_first rules.
        # `pnpm run` because pnpm's built-in `deploy` command shadows scripts.
        run: pnpm run deploy

      - name: Smoke-test production
        # The point of this site is that agents can read it, so the deploy
        # isn't done until the agent surfaces answer on the real domain.
        run: |
          set -euo pipefail
          for path in / /llms.txt /agent-readability.json /.well-known/agent-skills/index.json; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "https://alzheimers.dev$path")"
            echo "$path -> $code"
            [ "$code" = "200" ]
          done
          # MCP answers JSON-RPC over POST.
          curl -sS -X POST https://alzheimers.dev/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q search_docs
          # `Accept: text/markdown` returns the page's Markdown mirror.
          curl -sS -H 'accept: text/markdown' https://alzheimers.dev/ | grep -q 'AI-native'

      - name: Audit the live deployment
        # Advisory: adds the network tier — status codes, response headers, and
        # the DNS-AID record — on top of what CI checked offline. DNS changes
        # propagate on their own schedule, so this reports without blocking.
        continue-on-error: true
        run: pnpm audit:agents --url https://alzheimers.dev

      - name: Summarize
        run: |
          {
            echo "### Deployed to production"
            echo
            echo "- Site: https://alzheimers.dev"
            echo "- Corpus index: https://alzheimers.dev/llms.txt"
            echo "- Agent manifest: https://alzheimers.dev/agent-readability.json"
            echo "- MCP endpoint: https://alzheimers.dev/mcp"
          } >> "$GITHUB_STEP_SUMMARY"
